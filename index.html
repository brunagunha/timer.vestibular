<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contagem Regressiva - Vestibulares</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>⏰ Foco na Vaga!</h1>
        <p class="subtitle">Selecione o vestibular para ver o tempo restante até a prova.</p>

        <!-- Seletor de Vestibulares -->
        <div class="selector-wrapper">
            <label for="vestibular-select">Escolha o Vestibular:</label>
            <select id="vestibular-select">
                <option value="enem">ENEM (1º Dia)</option>
                <option value="fuvest">FUVEST (1ª Fase)</option>
                <option value="ufpr">UFPR</option>
                <option value="uel">UEL</option>
                <option value="uem">UEM (Verão)</option>
                <option value="uepg">UEPG</option>
                <option value="unicentro">UNICENTRO</option>
                <option value="unioeste">UNIOESTE</option>
                <option value="utfpr">UTFPR</option>
                <option value="puc">PUC-PR</option>
            </select>
        </div>

        <!-- Painel do Cronômetro -->
        <div class="timer-display">
            <h2 id="vestibular-title">ENEM</h2>
            <p class="exam-date">Data da Prova: <span id="exam-date-text">--/--/----</span></p>
            
            <div class="countdown-container">
                <div class="time-box">
                    <span id="days">00</span>
                    <p>Dias</p>
                </div>
                <div class="time-box">
                    <span id="hours">00</span>
                    <p>Horas</p>
                </div>
                <div class="time-box">
                    <span id="minutes">00</span>
                    <p>Minutos</p>
                </div>
                <div class="time-box">
                    <span id="seconds">00</span>
                    <p>Segundos</p>
                </div>
            </div>
            <p id="finished-message" class="finished-hidden">🎉 A prova começou ou já aconteceu!</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
